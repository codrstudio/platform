<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg" class="blueprint-banner">
  <style>
    .blueprint-banner { color: hsl(var(--primary)); }
    .bg-grad-start { stop-color: currentColor; stop-opacity: 0.1; }
    .bg-grad-end { stop-color: currentColor; stop-opacity: 0.3; }
    .grid-line { stroke: currentColor; stroke-width: 0.5; opacity: 0.1; fill: none; }
    .primary-text { fill: currentColor; }
    .primary-stroke { stroke: currentColor; stroke-width: 2; opacity: 0.3; fill: none; }
    .secondary-text { fill: hsl(var(--muted-foreground)); }
    .code-brace { fill: currentColor; opacity: 0.4; }
  </style>
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" class="bg-grad-start" />
      <stop offset="100%" class="bg-grad-end" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" fill="url(#bgGradient)" rx="8"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" class="grid-line"/>
    </pattern>
  </defs>
  <rect width="800" height="200" fill="url(#grid)"/>
  <text x="400" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" class="primary-text" text-anchor="middle">Blueprint Module</text>
  <text x="400" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="18" class="secondary-text" text-anchor="middle">Módulo de Referência para Desenvolvimento</text>
  <circle cx="80" cy="100" r="30" class="primary-stroke"/>
  <circle cx="720" cy="100" r="30" class="primary-stroke"/>
  <text x="120" y="110" font-family="monospace" font-size="36" font-weight="bold" class="code-brace">{</text>
  <text x="660" y="110" font-family="monospace" font-size="36" font-weight="bold" class="code-brace">}</text>
</svg>
