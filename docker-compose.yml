version: '3.8'

services:
  # =============================================================================
  # Redis - Cache, Pub/Sub, Streams
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  # =============================================================================
  # Backend - Express + Node.js
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    container_name: platform-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - N8N_URL=https://n8n.codrstudio.dev
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/backend/uploads
      - backend-logs:/app/backend/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/1/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - platform-network

  # =============================================================================
  # Frontend - React 19 + Vite (Nginx serving static files)
  # =============================================================================
  frontend:
    image: nginx:alpine
    container_name: platform-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - platform-network

  # =============================================================================
  # Development Environment (Optional)
  # =============================================================================
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    container_name: platform-dev
    restart: unless-stopped
    ports:
      - "5173:5173"  # Vite dev server
      - "3001:3000"  # Backend dev server
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - N8N_URL=https://n8n.codrstudio.dev
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-refresh-secret-key}
      - VITE_API_URL=http://localhost:3000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:cached
      - ./spec:/app/spec:ro
      - /app/frontend/node_modules
      - /app/backend/node_modules
    networks:
      - platform-network
    profiles:
      - dev

  # =============================================================================
  # Redis Commander (Optional - Redis Management UI)
  # =============================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: platform-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - platform-network
    profiles:
      - tools

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local
  backend-uploads:
    driver: local
  backend-logs:
    driver: local
  frontend-dist:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  platform-network:
    driver: bridge
