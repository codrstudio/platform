<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>NIC Chat - Núcleo de Inteligência e Conhecimento</title>
    <meta name="title" content="NIC Chat - Núcleo de Inteligência e Conhecimento" />
    <meta name="description" content="Chat inteligente com IA para educação e produtividade. Gamificação e jornada de descoberta." />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/light/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/light/icon-512x512.png" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NIC Chat" />

    <!-- Apple Touch Icons (iOS) - Múltiplos tamanhos -->
    <link rel="apple-touch-icon" href="/icons/light/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/light/apple-touch-icon-120x120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/light/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/light/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/light/apple-touch-icon-180x180.png" />

    <!-- Fallback tema escuro (iOS 18+) -->
    <link rel="apple-touch-icon" media="(prefers-color-scheme: dark)" sizes="180x180" href="/icons/dark/apple-touch-icon-180x180.png" />

    <!-- Android PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="NIC Chat" />

    <!-- Theme Color (adaptativo light/dark) -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
